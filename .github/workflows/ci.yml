name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, types, tests, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium
      # Build, lint (Biome, publint, Are the Types Wrong), type check, unit
      # and browser tests, size budgets of the script-tag builds.
      - run: pnpm run check

  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the lowest Node.js in `engines`. The unit tests need 22.6+
        # (vitest, --experimental-strip-types): they run on 22 in the job
        # above and on 24 here; on 18 and 20 the built packages are loaded
        # and used without the test tools.
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == 24
        run: pnpm test
      - name: Load the built packages (ESM and CJS)
        run: node scripts/smoke.mjs
